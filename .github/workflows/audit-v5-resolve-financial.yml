name: Audit v5 resolve financial differences

on:
  workflow_dispatch:
  push:
    branches:
      - audit-v5
    paths:
      - "audit-v5/financial_difference_reconcile.py"
      - "audit-v5/tests/test_financial_difference_reconcile.py"
      - "audit-v5/official_financial_check.py"
      - "audit-v5/FINANCIAL-POLICY.md"
      - ".github/workflows/audit-v5-resolve-financial.yml"

permissions:
  contents: write

concurrency:
  group: audit-v5-resolve-financial
  cancel-in-progress: true

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-v5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install beautifulsoup4

      - name: Run reconciliation tests
        run: python -X utf8 audit-v5/tests/test_financial_difference_reconcile.py

      - name: Refresh canonical official comparison
        run: |
          mkdir -p audit-v5/work audit-v5/generated
          python -X utf8 audit-v5/official_financial_check.py             --root Pilot_Reports             --summary audit-v5/generated/official-financial-summary.json             --details audit-v5/work/official-financial-details-before-resolution.json

      - name: Resolve and apply non-operating-income differences
        run: |
          python -X utf8 audit-v5/financial_difference_reconcile.py             --summary audit-v5/generated/official-financial-summary.json             --output audit-v5/generated/financial-difference-resolution.json             --apply

      - name: Re-run canonical comparison after repair
        run: |
          python -X utf8 audit-v5/official_financial_check.py             --root Pilot_Reports             --summary audit-v5/generated/official-financial-summary.json             --details audit-v5/work/official-financial-details-after-resolution.json

      - name: Upload financial diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: audit-v5-financial-resolution-${{ github.run_id }}
          path: |
            audit-v5/work/official-financial-details-before-resolution.json
            audit-v5/work/official-financial-details-after-resolution.json
          retention-days: 90

      - name: Commit resolved financials and audit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pilot_Reports audit-v5/generated/official-financial-summary.json audit-v5/generated/financial-difference-resolution.json
          if git diff --cached --quiet; then
            echo "No financial changes to commit."
          else
            git commit -m "audit: resolve current-period financial differences [skip ci]"
            git fetch origin audit-v5
            git rebase origin/audit-v5
            git push origin HEAD:audit-v5
          fi
