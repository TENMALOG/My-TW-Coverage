name: Audit v5 build semantic HIGH queue

on:
  workflow_dispatch:
  push:
    branches: [audit-v5]
    paths:
      - 'audit-v5/semantic_queue.py'
      - '.github/workflows/audit-v5-semantic-queue.yml'

permissions:
  contents: write

concurrency:
  group: audit-v5-semantic-queue
  cancel-in-progress: true

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-v5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build calibrated HIGH claim queue
        run: python -X utf8 audit-v5/semantic_queue.py
      - name: Commit queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-v5/generated/semantic-high-queue.json
          if git diff --cached --quiet; then
            echo 'Queue unchanged.'
          else
            git commit -m 'audit-v5: materialize calibrated semantic HIGH queue [skip ci]'
            git fetch origin audit-v5
            git rebase origin/audit-v5
            git push origin HEAD:audit-v5
          fi
