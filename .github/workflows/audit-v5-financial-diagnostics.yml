name: Audit v5 financial diagnostics

on:
  workflow_dispatch:
  push:
    branches: [audit-v5]
    paths:
      - ".github/workflows/audit-v5-financial-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run financial diagnostics
        run: |
          mkdir -p audit-v5/work audit-v5/generated
          python -X utf8 audit-v5/official_financial_check.py \
            --root Pilot_Reports \
            --summary audit-v5/generated/official-financial-diagnostics-summary.json \
            --details audit-v5/work/official-financial-diagnostics-details.json

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: audit-v5-financial-diagnostics-${{ github.run_id }}
          path: |
            audit-v5/generated/official-financial-diagnostics-summary.json
            audit-v5/work/official-financial-diagnostics-details.json
          retention-days: 30
