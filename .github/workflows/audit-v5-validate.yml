name: Audit v5 validate

on:
  workflow_dispatch:
  push:
    branches:
      - audit-v5
    paths:
      - "audit-v5/**"
      - "Pilot_Reports/**"
      - "README.md"
      - "CLAUDE.md"
      - ".github/workflows/audit-v5-validate.yml"

permissions:
  contents: write

concurrency:
  group: audit-v5-validate
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout audit-v5
        uses: actions/checkout@v4
        with:
          ref: audit-v5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit and regression tests
        run: |
          python -m unittest discover -s audit-v5/tests -v
          python -X utf8 audit-v5/auditctl.py regression-1304

      - name: Run deterministic machine gate
        run: |
          mkdir -p audit-v5/work audit-v5/generated
          python -X utf8 audit-v5/auditctl.py scan \
            --root Pilot_Reports \
            --output audit-v5/work/machine-gate.json

      - name: Run risk calibration
        run: |
          PYTHONPATH=audit-v5 python -X utf8 audit-v5/risk_calibration.py \
            --root Pilot_Reports \
            --output audit-v5/generated/risk-calibration.json

      - name: Build fresh GitHub baseline and summary
        run: |
          python -X utf8 audit-v5/bootstrap.py \
            --root Pilot_Reports \
            --git-sha "${GITHUB_SHA}" \
            --branch audit-v5 \
            --output audit-v5/generated/github-baseline.json

          python -X utf8 audit-v5/summarize.py \
            --baseline audit-v5/generated/github-baseline.json \
            --scan audit-v5/work/machine-gate.json \
            --financial audit-v5/generated/financial-refresh-summary.json \
            --output audit-v5/generated/audit-summary.json

      - name: Upload validation diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: audit-v5-validate-${{ github.run_id }}
          path: audit-v5/work/machine-gate.json
          retention-days: 30

      - name: Commit refreshed validation summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-v5/generated/github-baseline.json audit-v5/generated/audit-summary.json audit-v5/generated/risk-calibration.json
          if git diff --cached --quiet; then
            echo "No validation summary changes."
          else
            git commit -m "audit: refresh v5 validation summary [skip ci]"
            git fetch origin audit-v5
            git rebase origin/audit-v5
            git push origin HEAD:audit-v5
          fi
