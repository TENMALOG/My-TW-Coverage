name: Audit v5 close repo missing financial values

on:
  workflow_dispatch:
  push:
    branches: [audit-v5]
    paths:
      - "audit-v5/close_repo_value_unavailable.py"
      - ".github/workflows/audit-v5-close-repo-values.yml"

permissions:
  contents: write

concurrency:
  group: audit-v5-financial-final-writer
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-v5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install beautifulsoup4

      - name: Fill missing Q1 and Q2 values from official evidence
        run: python -X utf8 audit-v5/close_repo_value_unavailable.py

      - name: Re-run official checker
        run: |
          mkdir -p audit-v5/work
          python -X utf8 audit-v5/official_financial_check.py --root Pilot_Reports --summary audit-v5/generated/official-financial-summary.json --details audit-v5/work/official-financial-details-after-missing-close.json

      - name: Require repo unavailable to be zero
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("audit-v5/generated/official-financial-summary.json").read_text(encoding="utf-8"))
          n=p.get("status_counts",{}).get("REPO_VALUE_UNAVAILABLE",0)
          print("REPO_VALUE_UNAVAILABLE =",n)
          raise SystemExit(0 if n==0 else 2)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-v5-repo-values-close
          path: |
            audit-v5/generated/repo-value-unavailable-close.json
            audit-v5/generated/official-financial-summary.json
            audit-v5/work/official-financial-details-after-missing-close.json
          retention-days: 90

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pilot_Reports audit-v5/generated/repo-value-unavailable-close.json audit-v5/generated/official-financial-summary.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: fill remaining Phase 1 official values [skip ci]"
            git fetch origin audit-v5
            git rebase origin/audit-v5
            git push origin HEAD:audit-v5
          fi
