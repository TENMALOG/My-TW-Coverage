name: Audit v5 close financial phase1

on:
  workflow_dispatch:
  push:
    branches: [audit-v5]
    paths:
      - "audit-v5/official_operating_income_refresh.py"
      - "audit-v5/resolve_financial_differences.py"
      - "audit-v5/official_financial_check.py"
      - "audit-v5/FINANCIAL-POLICY.md"
      - ".github/workflows/audit-v5-financial-phase1-close.yml"

permissions:
  contents: write

concurrency:
  group: audit-v5-financial-phase1-close
  cancel-in-progress: true

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout audit-v5
        uses: actions/checkout@v4
        with:
          ref: audit-v5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install beautifulsoup4

      - name: Apply approved official Operating Income mapping
        run: |
          PYTHONPATH=audit-v5 python -X utf8 audit-v5/official_operating_income_refresh.py \
            --root Pilot_Reports \
            --summary audit-v5/generated/operating-income-refresh.json

      - name: Recompute official differences
        run: |
          mkdir -p audit-v5/work
          PYTHONPATH=audit-v5 python -X utf8 audit-v5/official_financial_check.py \
            --root Pilot_Reports \
            --summary audit-v5/generated/official-financial-summary.json \
            --details audit-v5/work/official-financial-details-before-resolution.json

      - name: Resolve and patch remaining current-period differences
        run: |
          PYTHONPATH=audit-v5 python -X utf8 audit-v5/resolve_financial_differences.py \
            --input audit-v5/generated/official-financial-summary.json \
            --output audit-v5/generated/financial-difference-resolution.json

      - name: Final official verification
        run: |
          PYTHONPATH=audit-v5 python -X utf8 audit-v5/official_financial_check.py \
            --root Pilot_Reports \
            --summary audit-v5/generated/official-financial-summary.json \
            --details audit-v5/work/official-financial-details-final.json

      - name: Upload full financial diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: audit-v5-financial-phase1-\${{ github.run_id }}
          path: |
            audit-v5/work/official-financial-details-before-resolution.json
            audit-v5/work/official-financial-details-final.json
          retention-days: 90

      - name: Commit officialized current-period financials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pilot_Reports audit-v5/generated audit-v5/FINANCIAL-POLICY.md
          if git diff --cached --quiet; then
            echo "No financial changes."
          else
            git commit -m "data: close audit-v5 financial phase1 [skip ci]"
            git fetch origin audit-v5
            git rebase origin/audit-v5
            git push origin HEAD:audit-v5
          fi
